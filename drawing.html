<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디지털 윤리 그림 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap">
<style>
:root{--bg:#fff4dc;--card:#fffdf7;--ink:#3a3a4a;--accent:#ff7a90;--mint:#8fe0cc;--sky:#a5d4ff;--sun:#ffe08a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2533;--card:#38323f;--ink:#f6efe6;--accent:#ff8fa3;--mint:#4fb8a2;--sky:#5a8fc4;--sun:#c9a43a}}
:root[data-theme="dark"]{--bg:#2a2533;--card:#38323f;--ink:#f6efe6;--accent:#ff8fa3;--mint:#4fb8a2;--sky:#5a8fc4;--sun:#c9a43a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jua,"Noto Sans KR",sans-serif;font-size:18px;
background-image:radial-gradient(circle,rgba(127,127,127,.18) 2px,transparent 2.5px);background-size:28px 28px}
main{max-width:1080px;margin:0 auto;padding:14px;display:grid;gap:16px}
header{text-align:center}
h1{margin:4px 0;font-size:clamp(28px,6vw,44px);letter-spacing:.02em}
header p{margin:0;font-size:clamp(16px,3.5vw,20px);opacity:.85}
h2{margin:0 0 8px;font-size:20px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:12px;box-shadow:0 5px 0 var(--ink)}
@media(min-width:900px){main{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);align-items:start}header{grid-column:1/-1}}
button{font:inherit;color:var(--ink);cursor:pointer;border:3px solid var(--ink);border-radius:16px;background:var(--card);min-height:46px;padding:6px 14px;box-shadow:0 3px 0 var(--ink);touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:none}
button:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
@media(min-width:560px){.thumbs{grid-template-columns:repeat(6,1fr)}}
.thumbs button{padding:4px;display:grid;gap:2px;font-size:13px;line-height:1.15;min-height:0}
.thumbs svg{width:100%;height:auto;background:#fff;border-radius:10px;display:block}
.thumbs button[aria-pressed=true]{background:var(--sun)}
#stage{position:relative;aspect-ratio:4/3;container-type:inline-size;background:#fff;border:3px solid var(--ink);border-radius:18px;overflow:hidden;touch-action:manipulation}
#art svg{display:block;width:100%;height:auto}
#art .f{cursor:pointer}
#layer{position:absolute;inset:0;pointer-events:none}
#draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
#shp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#shp *{pointer-events:visiblePainted}
#shp [data-id]{cursor:pointer}
#nm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:9}
#nm div{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;width:min(420px,100%);text-align:center}
#nm input{font:inherit;font-size:22px;width:100%;padding:10px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:#3a3a4a;text-align:center}
#nmp{font-size:15px;min-height:1.2em;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:10;text-align:center}
#stage.drawing #draw{pointer-events:auto;cursor:crosshair}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.tools button[aria-pressed=true],.mini button[aria-pressed=true]{background:var(--sun)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mini button{min-width:56px;font-size:20px}
.stk{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;cursor:grab;user-select:none;white-space:nowrap;line-height:1.2;color:#3a3a4a}
.stk.t{font-family:Gaegu,Jua,sans-serif;font-weight:700;padding:.3em .8em;border:3px solid #3a3a4a;border-radius:999px}
.stk.sel{outline:3px dashed #ff5c7a;outline-offset:4px;border-radius:14px}
.h{display:none;position:absolute;width:32px;height:32px;border-radius:50%;background:#ff5c7a;color:#fff;border:3px solid #fff;font:700 18px/1 sans-serif;place-items:center;cursor:pointer;touch-action:none;box-shadow:0 2px 0 #3a3a4a}
.sel .h{display:grid}
.hr{left:50%;top:-48px;margin-left:-16px}
.hs{right:-20px;bottom:-20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tabs button[aria-selected=true]{background:var(--accent);color:#3a3a4a}
.pal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:10px}
.pal button{aspect-ratio:1;min-height:0;padding:0;border-radius:50%}
.pal button[aria-pressed=true]{outline:4px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.emo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.emo button{font-size:28px;padding:2px;min-height:50px}
.sen{display:grid;gap:6px;max-height:260px;overflow:auto;padding:2px 2px 6px}
.sen button{font-family:Gaegu,Jua,sans-serif;font-weight:700;font-size:20px;text-align:left;color:#3a3a4a}
.save{width:100%;margin-top:12px;background:var(--mint);font-size:22px;min-height:56px;color:#3a3a4a}
[hidden]{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:9}
#modal div{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px;max-width:560px;text-align:center}
#modal img{width:100%;height:auto;border-radius:12px;border:3px solid var(--ink);background:#fff}
</style>
</head>
<body>
<main>
<header>
<h1>🎨 디지털 윤리 그림 놀이터</h1>
<p>그림을 고르고, 색칠하고, 스티커로 꾸며요!</p>
</header>

<section class="card" aria-label="그림 만들기">
<h2>그림을 골라요</h2>
<div class="thumbs" id="thumbs"></div>
<div id="stage"><div id="art"></div><svg id="shp" width="800" height="600" viewBox="0 0 800 600"></svg><canvas id="draw" width="800" height="600"></canvas><div id="layer"></div></div>
</section>

<section class="card" aria-label="도구">
<div class="tabs" role="tablist">
<button role="tab" id="t1" aria-selected="true">🖍️ 색칠하기</button>
<button role="tab" id="t2" aria-selected="false">✨ 꾸미기</button>
</div>

<div id="p1">
<h2>도구를 골라요</h2>
<div class="tools" id="tools">
<button data-m="fill" aria-pressed="true">🪣 색칠하기</button>
<button data-m="pen" aria-pressed="false">✏️ 선 그리기</button>
<button data-m="shape" aria-pressed="false">🔷 도형</button>
<button data-m="erase" aria-pressed="false">🧽 지우개</button>
</div>
<div class="mini" id="shapes" hidden>
<button data-s="circle" aria-label="동그라미" aria-pressed="true">●</button>
<button data-s="rect" aria-label="네모" aria-pressed="false">■</button>
<button data-s="tri" aria-label="세모" aria-pressed="false">▲</button>
<button data-s="star" aria-label="별" aria-pressed="false">★</button>
<button data-s="heart" aria-label="하트" aria-pressed="false">♥</button>
</div>
<div class="mini" id="sizes" hidden>
<button data-z="0" aria-pressed="false">가늘게</button>
<button data-z="1" aria-pressed="true">보통</button>
<button data-z="2" aria-pressed="false">굵게</button>
</div>
<h2 id="hint">색을 골라서 그림을 콕! 눌러요</h2>
<div class="pal" id="pal"></div>
<div class="row"><button id="undo">↩️ 되돌리기</button><button id="reset">🧹 처음부터</button></div>
</div>

<div id="p2" hidden>
<h2>스티커를 눌러서 붙여요</h2>
<div class="emo" id="emo"></div>
<h2>약속 문장 스티커</h2>
<div class="sen" id="sen"></div>
<h2 style="margin-top:12px">고른 스티커</h2>
<div class="row"><button id="big">➕ 크게</button><button id="small">➖ 작게</button><button id="del">🗑️ 지우기</button></div>
<p style="margin:0;font-size:15px;opacity:.8">스티커를 끌면 움직여요. 스티커를 누르면 ↻ 동그라미로 돌리고, ↘ 동그라미로 크기를 바꿀 수 있어요.</p>
</div>

<button class="save" id="save">💾 그림 저장하기</button>
</section>
</main>

<div id="nm" hidden><div><p style="margin-top:0">내 이름을 적어요</p><input id="nmi" maxlength="12" placeholder="예) 최자두" autocomplete="off" aria-label="내 이름"><p id="nmp"></p><p style="margin-bottom:0"><button id="nmok">💾 저장하기</button> <button id="nmno">취소</button></p></div></div>
<div id="toast" hidden></div>
<div id="modal" hidden><div><p>그림을 꾹 눌러서 저장해요!</p><img id="out" alt="완성한 그림"><p><button id="close">닫기</button></p></div></div>
